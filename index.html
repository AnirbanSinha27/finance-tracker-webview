<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Charts</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d1117'/%3E%3Cpath d='M3 11l3-4 3 2 4-6' stroke='%2326a69a' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0d1117; --pane:#161b22; --line:#30363d; --fg:#c9d1d9; --dim:#8b949e;
          --up:#26a69a; --down:#ef5350; --accent:#3aa7ff; }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden;
         background:var(--bg); color:var(--fg);
         font:13px/1.4 ui-sans-serif, system-ui, -apple-system, sans-serif; }

  /* ------------------------------------------------------------- header */
  header { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
           padding:7px 12px; border-bottom:1px solid var(--line); flex:none; }
  header h1 { font-size:13px; margin:0; font-weight:600; letter-spacing:.04em;
              text-transform:uppercase; color:var(--dim); }
  header label { display:flex; align-items:center; gap:6px; color:var(--dim); font-size:12px; }
  #status { margin-left:auto; font-size:11px; letter-spacing:.02em; white-space:pre; }
  #status.ok { color:var(--dim); } #status.bad { color:var(--down); }

  select, input.sym { background:#0d1117; color:var(--fg); border:1px solid var(--line);
                      border-radius:5px; padding:3px 6px; font:inherit; font-size:12px; }
  input.sym { width:100%; min-width:0; flex:1; text-transform:uppercase; font-weight:600;
              letter-spacing:.02em; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

  /* --------------------------------------------------------------- grid */
  #grid { flex:1; display:grid; gap:6px; padding:6px; min-height:0; }
  #grid[data-n="1"] { grid-template-columns:1fr; }
  #grid[data-n="2"] { grid-template-columns:repeat(2,1fr); }
  #grid[data-n="4"] { grid-template-columns:repeat(2,1fr); grid-template-rows:repeat(2,1fr); }
  #grid[data-n="6"] { grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); }
  #grid[data-n="8"] { grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(2,1fr); }

  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--pane);
          border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .pane.max { position:fixed; inset:44px 6px 6px; z-index:30; }
  body.has-max #grid { visibility:hidden; }
  body.has-max .pane.max { visibility:visible; }
  .pane.alerted { border-color:#facc15; box-shadow:0 0 0 1px #facc15; }

  /* ----------------------------------------------------------- ticker bar */
  .bar { display:flex; align-items:center; gap:5px; padding:4px 6px; flex:none;
         border-bottom:1px solid var(--line); }
  .price { font-variant-numeric:tabular-nums; font-weight:600; white-space:nowrap; }
  .chg { font-variant-numeric:tabular-nums; font-size:11px; white-space:nowrap; }
  .up { color:var(--up); } .down { color:var(--down); }
  .price.err { color:var(--down); font-weight:400; font-size:11px; }
  .ico { background:none; border:1px solid var(--line); color:var(--dim); border-radius:5px;
         cursor:pointer; font:inherit; font-size:12px; line-height:1; padding:4px 6px; flex:none; }
  .ico:hover { color:var(--fg); border-color:var(--dim); }

  @keyframes flashUp   { from { background:rgba(38,166,154,.5) } to { background:transparent } }
  @keyframes flashDown { from { background:rgba(239,83,80,.5) }  to { background:transparent } }
  .bar.up   { animation:flashUp .45s ease-out; }
  .bar.down { animation:flashDown .45s ease-out; }

  /* ------------------------------------------------------- chart + legend */
  .wrap { position:relative; flex:1; min-height:0; }
  .chart { position:absolute; inset:0; }
  .legend { position:absolute; top:4px; left:8px; z-index:3; pointer-events:none;
            display:flex; gap:8px; flex-wrap:wrap; font-size:11px;
            font-variant-numeric:tabular-nums; text-shadow:0 0 4px var(--pane); }
  .legend b { font-size:12px; letter-spacing:.02em; }
  .legend .dim { color:var(--dim); }
  .legend.loading::after { content:'loading history…'; color:var(--dim); }

  .hint { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); z-index:4;
          background:var(--accent); color:#04121f; padding:3px 10px; border-radius:99px;
          font-size:11px; font-weight:600; }

  /* --------------------------------------------------------------- menu */
  .menu { position:absolute; top:0; left:0; z-index:10; width:min(270px,calc(100% - 12px));
          max-height:100%; overflow:auto; background:#0d1117; border:1px solid var(--line);
          border-radius:6px; padding:8px; box-shadow:0 8px 24px #000a; }
  .menu .sec { color:var(--dim); font-size:10px; text-transform:uppercase;
               letter-spacing:.08em; margin:6px 0 4px; }
  .menu .sec:first-child { margin-top:0; }
  .chips { display:flex; flex-wrap:wrap; gap:4px; }
  .chip { background:#161b22; border:1px solid var(--line); color:var(--dim); border-radius:5px;
          padding:3px 7px; font:inherit; font-size:11px; cursor:pointer; }
  .chip:hover { color:var(--fg); }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#04121f; font-weight:600; }

  /* --------------------------------------------------------- responsive */
  @media (max-width:1200px) {
    #grid[data-n="6"], #grid[data-n="8"] { grid-template-columns:repeat(2,1fr);
                                           grid-template-rows:none; grid-auto-rows:1fr; }
  }
  @media (max-width:760px) {
    body { height:auto; overflow:auto; }
    #grid[data-n] { grid-template-columns:1fr; grid-template-rows:none; grid-auto-rows:320px; }
    #status { width:100%; margin-left:0; }
  }
  @media (prefers-reduced-motion:reduce) { .bar.up, .bar.down { animation:none; } }
</style>
</head>
<body>

<header>
  <h1>Live Charts</h1>
  <label>Charts
    <select id="count">
      <option>1</option><option>2</option><option>4</option><option>6</option><option>8</option>
    </select>
  </label>
  <label><input type="checkbox" id="sync"> Sync crosshair &amp; zoom</label>
  <span id="status"></span>
</header>

<main id="grid"></main>
<datalist id="symbols"></datalist>

<script type="module" src="dashboard.js"></script>
</body>
</html>
